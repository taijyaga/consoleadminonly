<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Cloud Console - Sign In</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f0f6fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 40px;
            width: 340px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 30px;
        }
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #030712;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0284c7;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0369a1;
        }
        .footer-text {
            margin-top: 25px;
            font-size: 11px;
            color: #4b5563;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">⚡ CLOUD-NODE</div>
        <div class="subtitle">Central Infrastructure Management</div>
        
        <!-- ユーザー名入力 -->
        <div class="input-group">
            <label for="username">Username / ID</label>
            <input type="text" id="username" placeholder="e.g. admin" autocomplete="off">
        </div>
        
        <!-- パスワード入力 -->
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        
        <!-- サインインボタン -->
        <button onclick="triggerHackerMonitor()">Sign In</button>
        
        <div class="footer-text">
            WARNING: Authorized access only. All activities are monitored.
        </div>
    </div>

    <script>
        // あなたのWindows PCの住所を設定済み
        const WINDOWS_CONSOLE_IP = "106.72.61.98"; 

        function triggerHackerMonitor() {
            const userInput = document.getElementById('username').value || "unknown";
            
            // あなたのWindowsのEXE（ポート5000）へデータを送信
            fetch(`http://${WINDOWS_CONSOLE_IP}:5000/`, {
                method: 'POST',
                mode: 'no-cors', // セキュリティエラー回避のためのノークロスドメイン
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    account: userInput,
                    breach: false // 常に「ATTACK」ログとして送る設定
                })
            }).catch(err => {
                console.log("Transmission failed. Check firewall or router port forwarding.", err);
            });

            // ハッカー側には「ログイン失敗」を見せて諦めさせず、何度も試行させる
            alert("Error 403: Invalid credentials or account locked. Please try again.");
        }
    </script>
</body>
</html>
